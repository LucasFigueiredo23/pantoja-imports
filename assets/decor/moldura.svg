    <rect x="6" y="6" width="288" height="608" rx="52" stroke-width="5"/>
    <rect x="16" y="16" width="268" height="588" rx="43" stroke-width="1.2" stroke-opacity=".55"/>
  </g>
  <g fill="#000">
    <rect x="0.5" y="150" width="4" height="30" rx="2"/>
    <rect x="0.5" y="205" width="4" height="56" rx="2"/>
    <rect x="0.5" y="275" width="4" height="56" rx="2"/>
    <rect x="295.5" y="225" width="4" height="88" rx="2"/>
  </g>
</svg>
